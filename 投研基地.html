<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投研基地 — 独立买方深度投研报告索引</title>
<style>
:root {
  --navy: #1a237e; --blue: #283593; --light-blue: #e8eaf6;
  --accent: #c62828; --green: #2e7d32; --gold: #ff8f00;
  --text: #212121; --text2: #424242; --gray: #757575;
  --bg: #f5f7fa; --white: #fff; --border: #e0e0e0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #0d1b3e 0%, #1a237e 50%, #283593 100%);
  color: white; padding: 40px 20px; text-align: center;
  position: relative; overflow: hidden;
}
.header::before {
  content:''; position:absolute; top:-40%; right:-20%; width:400px; height:400px;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
  border-radius:50%;
}
.header-inner { position:relative; z-index:1; max-width:800px; margin:0 auto; }
.header h1 { font-size:32px; font-weight:800; letter-spacing:2px; margin-bottom:8px; }
.header h1 small { font-weight:300; font-size:18px; opacity:0.7; display:block; margin-top:4px; }
.header p { font-size:14px; opacity:0.75; margin-top:10px; }
.header-badge {
  display:inline-block; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
  padding:4px 16px; border-radius:20px; font-size:11px; letter-spacing:2px; margin-bottom:16px;
}
.container { max-width:960px; margin:0 auto; padding:30px 20px 60px; }

/* Stats */
.stats-row { display:flex; gap:16px; margin-bottom:30px; flex-wrap:wrap; }
.stat-card {
  flex:1; min-width:150px; background:var(--white); border-radius:10px;
  padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center;
  border-bottom:3px solid var(--blue);
}
.stat-card .stat-num { font-size:28px; font-weight:800; color:var(--navy); }
.stat-card .stat-label { font-size:12px; color:var(--gray); margin-top:4px; }

/* Section headers */
.section-title {
  font-size:18px; font-weight:700; color:var(--navy);
  margin:30px 0 16px; padding-bottom:8px;
  border-bottom:2px solid var(--light-blue);
  display:flex; align-items:center; gap:8px;
}

/* Report cards */
.report-list { display:flex; flex-direction:column; gap:14px; }
.report-card {
  background:var(--white); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.06);
  padding:20px 24px; display:flex; align-items:center; gap:20px;
  transition: all 0.2s ease; border-left:4px solid var(--blue);
}
.report-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.1); transform:translateY(-1px); }
.report-ticker {
  font-size:13px; font-weight:700; color:var(--white);
  background:var(--navy); padding:6px 12px; border-radius:6px;
  min-width:80px; text-align:center; flex-shrink:0;
}
.report-info { flex:1; }
.report-name { font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; }
.report-meta { font-size:12px; color:var(--gray); display:flex; gap:16px; flex-wrap:wrap; }
.report-rating { display:inline-block; padding:2px 10px; border-radius:4px; font-size:11px; font-weight:600; }
.rating-bullish { background:#e8f5e9; color:#2e7d32; }
.rating-cautious { background:#fff3e0; color:#e65100; }
.rating-neutral { background:#e3f2fd; color:#1565c0; }
.rating-bearish { background:#ffebee; color:#c62828; }
.report-links { display:flex; gap:8px; flex-shrink:0; }
.report-links a {
  display:inline-block; padding:5px 12px; border-radius:5px;
  font-size:11px; font-weight:600; text-decoration:none;
  border:1px solid var(--border); color:var(--text2);
  transition:all 0.15s ease;
}
.report-links a:hover { background:var(--light-blue); border-color:var(--blue); color:var(--navy); }

/* Empty state */
.empty-state {
  background:var(--white); border-radius:10px; padding:40px; text-align:center;
  color:var(--gray); border:2px dashed var(--border);
}
.empty-state p { font-size:14px; margin-bottom:8px; }

.footer {
  text-align:center; padding:30px; font-size:11px; color:var(--gray);
  border-top:1px solid var(--border); margin-top:40px;
}
@media(max-width:768px) {
  .report-card { flex-direction:column; align-items:stretch; text-align:center; }
  .report-meta { justify-content:center; }
  .report-links { justify-content:center; }
  .stats-row { flex-direction:column; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-badge">BUY-SIDE RESEARCH HUB</div>
    <h1>投研基地</h1>
    <p>独立买方深度投研报告索引 · 持续更新中</p>
  </div>
</div>

<div class="container">

<div class="stats-row">
  <div class="stat-card"><div class="stat-num" id="reportCount">—</div><div class="stat-label">已入库报告</div></div>
  <div class="stat-card"><div class="stat-num" id="coverageCount">—</div><div class="stat-label">覆盖标的</div></div>
  <div class="stat-card" style="border-bottom-color:var(--gold);"><div class="stat-num" id="latestDate">—</div><div class="stat-label">最近更新</div></div>
</div>

<div class="section-title">📄 报告列表</div>

<div class="report-list" id="reportList">
  <!-- 报告卡片由 JavaScript 动态生成 -->
</div>

</div>

<div class="footer">
  <p>投研基地 · 2026-05-03 初始化</p>
  <p style="margin-top:4px;">本基地收录的深度报告由独立买方投研决策系统生成，仅供参考，不构成投资建议</p>
</div>

<script>
// ════════════════════════════════════════════════
// 报告数据库 — 新增报告时在此添加条目
// 新增条目格式：
// { ticker: "股票代码", company: "公司名（中文）", market: "市场", 
//   date: "YYYY-MM-DD", rating: "评级", ratingClass: "样式类",
//   html: "HTML相对路径", pdf: "PDF相对路径", md: "MD相对路径" }
// ════════════════════════════════════════════════
var REPORTS = [
  {
    ticker: "9984.T",
    company: "SoftBank Group Corp.（软银集团）",
    market: "东京证券交易所",
    date: "2026-05-03",
    rating: "有条件看多",
    ratingClass: "rating-cautious",
    price: "¥5,424",
    target: "¥8,000~¥10,000",
    html: "软银集团公司研究报告.html",
    pdf: "软银集团公司研究报告.pdf",
    md: "软银集团公司研究报告.md"
  },
  {
    ticker: "SKM",
    company: "SK集团（深度研报）",
    market: "综合",
    date: "2026-05-03",
    rating: "深度分析",
    ratingClass: "rating-cautious",
    price: "—",
    target: "—",
    html: "SKM_深度研报.html",
    pdf: "SKM_深度研报.pdf",
    md: "SKM_深度研报.md"
  },
  {
    ticker: "6855.HK",
    company: "亚盛医药（Ascentage Pharma）",
    market: "香港交易所",
    date: "2026-04-27",
    rating: "深度分析",
    ratingClass: "rating-cautious",
    price: "—",
    target: "—",
    html: "6855HK_亚盛医药深度投研.html",
    pdf: "6855HK_亚盛医药深度投研.pdf",
    md: null
  },
  {
    ticker: "APP",
    company: "AppLovin Corp.",
    market: "纳斯达克",
    date: "2026-04-27",
    rating: "深度分析",
    ratingClass: "rating-cautious",
    price: "—",
    target: "—",
    html: "AppLovin公司研究报告.html",
    pdf: "AppLovin公司研究报告.pdf",
    md: "AppLovin公司研究报告.md"
  },
  {
    ticker: "NOK.N",
    company: "Nokia（诺基亚）",
    market: "纽约证券交易所",
    date: "2026-04-20",
    rating: "深度分析",
    ratingClass: "rating-cautious",
    price: "—",
    target: "—",
    html: "诺基亚公司研究报告.html",
    pdf: "诺基亚公司研究报告.pdf",
    md: "诺基亚公司研究报告.md"
  }
];

// ════════════════════════════════════════════════
// 渲染逻辑
// ════════════════════════════════════════════════
function render() {
  var list = document.getElementById('reportList');
  var html = '';
  REPORTS.sort(function(a,b){ return b.date.localeCompare(a.date); });
  REPORTS.forEach(function(r) {
    html += '<div class="report-card">';
    html += '<div class="report-ticker">' + r.ticker + '</div>';
    html += '<div class="report-info">';
    html += '<div class="report-name">' + r.company + '</div>';
    html += '<div class="report-meta">';
    html += '<span>📅 ' + r.date + '</span>';
    html += '<span>📍 ' + r.market + '</span>';
    html += '<span>💹 ' + r.price + '</span>';
    html += '<span>🎯 ' + r.target + '</span>';
    html += '<span class="report-rating ' + r.ratingClass + '">' + r.rating + '</span>';
    html += '</div></div>';
    html += '<div class="report-links">';
    if (r.html) html += '<a href="' + r.html + '" target="_blank">📄 HTML</a>';
    if (r.pdf) html += '<a href="' + r.pdf + '" target="_blank">📕 PDF</a>';
    if (r.md) html += '<a href="' + r.md + '" target="_blank">📝 Markdown</a>';
    html += '</div></div>';
  });
  list.innerHTML = html;
  
  // Stats
  var tickers = {}; REPORTS.forEach(function(r){ tickers[r.ticker] = true; });
  var dates = REPORTS.map(function(r){ return r.date; }).sort().reverse();
  document.getElementById('reportCount').textContent = REPORTS.length;
  document.getElementById('coverageCount').textContent = Object.keys(tickers).length + ' 只';
  document.getElementById('latestDate').textContent = dates[0] || '—';
}
render();
</script>

</body>
</html>
